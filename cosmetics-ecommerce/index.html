<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmoShop - Home</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">CosmoShop</div>
            <div class="search-bar">
                <input type="text" placeholder="Search cosmetics...">
                <button>🔍</button>
            </div>
            <div class="user-actions">
                <span class="account">👤</span>
                <span class="cart">
                    🛒 <span id="cart-count">0</span>
                </span>
            </div>
        </div>
    </header>

    <main>
        <div class="banner">
            <h1>Mother's Day Gift Recommendations</h1>
            <div class="banner-images">
                <img src="https://via.placeholder.com/300x200" alt="Lipstick">
                <img src="https://via.placeholder.com/300x200" alt="Skincare">
                <img src="https://via.placeholder.com/300x200" alt="Perfume">
            </div>
        </div>

        <section class="category-section">
            <h2>Shop by Category</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://via.placeholder.com/200x200" alt="Lipstick">
                    <h3>Lipstick</h3>
                    <p class="price">$15.99</p>
                    <p class="promo">Limited time 20% off</p>
                </div>
                <!-- Add more product cards -->
            </div>
        </section>

        <section class="category-section">
            <h2>Beauty Picks</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://via.placeholder.com/200x200" alt="Cleanser">
                    <h3>Facial Cleanser</h3>
                    <p class="price">$22.99</p>
                    <p class="promo">Limited time 15% off</p>
                </div>
                <!-- Add more product cards -->
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
